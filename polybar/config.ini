[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/main]
width = 100%
height = 18pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 4pt

border-size = 2pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Hack Nerd Font:size=10;0"

modules-left = launcher xworkspaces date systray
modules-center = xwindow
modules-right = xbacklight battery pulseaudio memory cpu power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces

strip-wsnumbers = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = 
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 0


[module/xwindow]
type = internal/xwindow
; label = %title:0:60:...%
label = "[ %class% ]"

; [module/filesystem]
; type = internal/fs
; interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "  "
label-muted-foreground = ${colors.disabled}

; [module/xkeyboard]
; type = internal/xkeyboard
; blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}󰤨 %{F-} %essid% %local_ip%
click-left = nm-applet

; [module/eth]
; inherit = network-base
; interface-type = wired
; label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %d-%m-%Y %H:%M
; date = %H:%M
; date-alt = %d-%m-%Y %H:%M

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/battery]
type = internal/battery

; format-low once this charge percentage is reached
low-at = 10

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

poll-interval = 5

; --- Charging ---
format-charging = <animation-charging> <label-charging>
animation-charging-0 = 󰂄
label-charging = %percentage%%
format-charging-foreground = ${colors.primary}
label-charging-foreground = ${colors.foreground}

; --- Discharging ---
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 󰁻
ramp-capacity-1 = 󰁽
ramp-capacity-2 = 󰁿
ramp-capacity-3 = 󰂁
ramp-capacity-4 = 󰁹
label-discharging = %percentage%%
format-discharging-foreground = ${colors.primary}
label-discharging-foreground = ${colors.foreground}

; --- Full ---
format-full = <ramp-capacity> <label-full>
label-full = %percentage%%
format-full-foreground = ${colors.primary}
label-full-foreground = ${colors.foreground}

[module/xbacklight]
type = internal/backlight
card = intel_backlight

format = <ramp> <label>
format-foreground = ${colors.primary}
label-foreground = ${colors.foreground}
ramp-0 =  
label = %percentage%%

poll-interval = 1

; --- Button ---
[module/power]
type = custom/text
label = "  "
format = <label>
format-foreground = #fc392b
click-left = systemctl poweroff
click-right = systemctl reboot
click-middle = systemctl sleep

; --- Launcher ---
[module/launcher]
type = custom/text
format = " "
format-foreground = #ffffff
click-left = rofi -show drun
click-right = rofi -show run
