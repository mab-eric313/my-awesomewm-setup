
[env]
TERM = "alacritty"

[font]
size = 9

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "Jet Brains Mono Nerd Font"
style = "Regular"

[general]
import = ["/home/eric/.config/alacritty/colors/ayu-dark.toml"]

[terminal.shell]
program = "sh"
args = ["-c", "if command -v zsh >/dev/null 2>&1; then exec zsh; else exec bash; fi"]
